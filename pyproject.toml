[project]
name = "gomoku-ai"
version = "0.1.0"
description = "Free-style Gomoku with pygame, MCTS, and policy/value training code."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pygame",
    "torch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
